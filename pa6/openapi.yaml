openapi: 3.0.3
info:
  title: PA6 Checkout Saga API
  version: 1.0.0
  description: >-
    API for POST /checkout, which runs a four-step checkout saga: payment
    authorization, inventory reservation, shipping creation and notification
    delivery. Steps run one after another, never in parallel. If a step fails
    or times out, any already-completed step that can be undone (payment,
    inventory) is rolled back, most recent first. The request body is the
    course's canonical order, restated here with a bound on items.
servers:
  - url: http://localhost:3000
    description: Local orchestrator started with docker compose.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check the orchestrator is alive
      description: Returns 200 as long as the orchestrator process is accepting requests.
      responses:
        "200":
          description: The orchestrator is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      summary: Run the checkout saga for one order
      description: >-
        Runs payment, inventory, shipping and notification in strict order
        for one order. On failure or timeout, completed steps with a
        compensating action are undone in reverse order before responding.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Caller-supplied key identifying this checkout attempt. Sending
            the same key with the same body returns the original result
            again instead of running the saga a second time.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: >-
          A canonical order. The saga derives the payment amount from its
          items and sends the completion notification to customer.email.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanonicalOrder"
      responses:
        "200":
          description: All four steps succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "400":
          description: The Idempotency-Key header is missing, or the body is not a valid canonical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            This Idempotency-Key was already used with a different body, or
            a request with this key is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A step failed. If earlier steps were undone successfully, status
            is compensated; if the undo itself failed, code is
            compensation_failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "504":
          description: A downstream call did not answer in time; any completed steps were undone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
components:
  schemas:
    HealthStatus:
      type: object
      description: Liveness payload.
      required: [status]
      properties:
        status:
          type: string
          description: Value is "ok" when the orchestrator can serve requests.
          enum: [ok]
    Address:
      type: object
      description: Where the order ships to.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street and house number.
          minLength: 1
        city:
          type: string
          description: City or town.
          minLength: 1
        postalCode:
          type: string
          description: Postal code, in the country's own format.
          minLength: 1
        country:
          type: string
          description: Two-letter country code (ISO 3166-1 alpha-2), e.g. LV.
    Customer:
      type: object
      description: Who placed the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Customer's full name.
          minLength: 1
        email:
          type: string
          description: Where the completion notification is sent.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: One priced line item on the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product id in the pricing API's own format.
          pattern: "^PROD-[0-9]+$"
        productName:
          type: string
          description: Product name for display.
          minLength: 1
        quantity:
          type: integer
          description: How many units of this item were ordered.
          minimum: 1
        unitPrice:
          type: string
          description: >-
            Price per unit as a decimal string with exactly two fraction
            digits, e.g. "22.50". Always a string, never a JSON number.
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          description: Currency the unitPrice is in, e.g. EUR.
        taxRate:
          type: number
          description: Tax rate as a fraction, e.g. 0.21 for 21%.
          minimum: 0
          maximum: 1
    CanonicalOrder:
      type: object
      description: >-
        The canonical order this API accepts. Same shape as
        canonical/order.schema.json, with one addition: items is bounded
        here, since the shared schema leaves it open-ended.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order id assigned by the source system.
          minLength: 1
        orderType:
          type: string
          description: Business order type.
          enum: [standard, express, b2b]
        source:
          type: string
          description: Which system produced this order.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          description: When the order was translated into this shape.
          format: date-time
        orderDate:
          type: string
          description: The order's own timestamp, UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: >-
            Line items on the order. Capped at 30 so one checkout request
            stays cheap to validate and cheap to retry.
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Order-level currency, e.g. EUR.
        status:
          type: string
          description: Order status when it was accepted.
          enum: [new, processing, shipped, delivered]
    TraceItem:
      type: object
      description: One step the saga actually ran, in the order it ran.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: >-
            Which step this is: payment, inventory, shipping, notification,
            or a rollback step (inventory_release, payment_refund).
          minLength: 1
        status:
          type: string
          description: How this step ended - success, failed or timeout.
          minLength: 1
        startedAt:
          type: string
          description: When this step started.
          format: date-time
        finishedAt:
          type: string
          description: When this step ended.
          format: date-time
        durationMs:
          type: integer
          description: How long this step took, in milliseconds.
          minimum: 0
    CheckoutResponse:
      type: object
      description: Outcome of one checkout attempt.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The orderId from the request.
          minLength: 1
        status:
          type: string
          description: Final state of the saga.
          enum: [completed, failed, compensated, in_progress]
        code:
          type: string
          description: Machine-readable reason, present whenever status is not completed.
        trace:
          type: array
          description: >-
            Every step the saga ran, including rollbacks. Capped at 6: four
            forward steps plus at most two rollback steps.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceItem"
    ErrorResponse:
      type: object
      description: Error shape for validation and idempotency failures.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable error code, e.g. validation_error, idempotency_payload_mismatch, idempotency_conflict.
          minLength: 1
        message:
          type: string
          description: Explanation a developer caller can act on.
          minLength: 1